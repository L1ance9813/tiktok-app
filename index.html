<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grumpy Old Grandpa - Content Pipeline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f; color: #e0e0e0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    .card {
      max-width: 500px; text-align: center;
      background: #1a1a1a; border-radius: 16px; padding: 3rem 2rem;
      border: 1px solid #2a2a2a;
    }
    h1 { font-size: 2rem; color: #ff4444; margin-bottom: 0.5rem; }
    p { color: #888; line-height: 1.6; margin-bottom: 1.5rem; }
    .badge {
      display: inline-block; background: #2a2a2a; color: #aaa;
      padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .links { display: flex; gap: 1rem; justify-content: center; }
    .links a {
      color: #4df; text-decoration: none; font-size: 0.9rem;
      padding: 0.5rem 1rem; border: 1px solid #333; border-radius: 8px;
      transition: all 0.2s;
    }
    .links a:hover { border-color: #ff4444; color: #ff4444; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎬 Grumpy Old Grandpa</h1>
    <div class="badge">Content Pipeline</div>
    <p>
      Automated content publishing pipeline for the Grumpy Old Grandpa animated series.
      This app manages video processing (FFmpeg stitching of thumbnails, videos, and outros)
      and multi-platform publishing to YouTube and TikTok.
    </p>
    <div class="links">
      <a href="tos.html">Terms of Service</a>
      <a href="privacy.html">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
